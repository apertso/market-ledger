<a class="skip-link" href="#main-content" (click)="$event.preventDefault(); mainContent.focus()"
  >Skip to content</a
>
<header class="app-header">
  <a class="brand" routerLink="/" aria-label="Market Ledger home"
    ><svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 17V7m8 13V4m8 11V9M1 7h6m2-3h6m2 5h6" /></svg
    >Market Ledger</a
  >
  <nav aria-label="Main navigation">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      >Market</a
    >
    <a routerLink="/settings" routerLinkActive="active" ariaCurrentWhenActive="page">Settings</a>
  </nav>
</header>
<main #mainContent id="main-content" tabindex="-1">
  @if (market.error(); as error) {
    <div class="error-notice" role="alert">
      <div>
        <strong>Producer stopped.</strong>
        <p>{{ error }}</p>
      </div>
      <button class="button secondary" (click)="market.apply(market.settings())">
        Restart run
      </button>
    </div>
  }
  <router-outlet />
</main>
